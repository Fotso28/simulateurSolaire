<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Autonomie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#8A5800}a:hover{color:#6B4400}
a:focus-visible,button:focus-visible{outline:2px solid #16181D;outline-offset:2px}
</style>
</helmet>
<div style="width: 360px; height: 1080px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F5F1; color: #16181D; font-family: 'IBM Plex Sans', system-ui, sans-serif">
  <header style="height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 16px 0 6px; background: #FFFFFF; border-bottom: 1px solid #E2E2DC">
    <a href="Besoins.dc.html" aria-label="Retour aux appareils" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #16181D">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
    </a>
    <span style="flex: 1; font-size: 16px; line-height: 20px; font-weight: 600">Autonomie</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #5E636B">ÉTAPE 4 / 5</span>
  </header>
  <div style="flex: none; display: flex; gap: 4px; padding: 10px 16px; background: #FFFFFF" aria-hidden="true">
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #16181D"></span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #16181D"></span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #16181D"></span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #F5B301"></span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #DCDCD5"></span>
  </div>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.01em">Combien de temps sans soleil&#160;?</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #5E636B">Vos batteries prennent le relais quand les panneaux ne produisent pas&#160;: la nuit, ou pendant des jours couverts. Plus d'autonomie demande plus de stockage.</p>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px" aria-label="Autonomie souhaitée">
      <sc-for list="{{tiers}}" as="t" hint-placeholder-count="5">
        <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 14px; box-sizing: border-box; border-radius: 12px; border: {{t.border}}; background: {{t.bg}}; font: inherit; color: inherit; text-align: left; cursor: pointer">
          <span style="width: 100%; display: flex; align-items: center; gap: 12px">
            <span style="width: 20px; height: 20px; flex: none; box-sizing: border-box; border-radius: 50%; border: 1.5px solid {{t.ring}}; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{t.dot}}"></span></span>
            <span style="flex: 1; display: flex; flex-direction: column">
              <span style="font-size: 16px; line-height: 22px; font-weight: 600">{{t.label}}</span>
              <span style="font-size: 13px; line-height: 18px; color: #5E636B">{{t.sub}}</span>
            </span>
            <span style="display: flex; flex-direction: column; align-items: flex-end">
              <span style="font-size: 16px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums">≈&#160;{{t.kwh}}&#160;kWh</span>
              <span style="font-size: 12px; line-height: 16px; color: #5E636B">de stockage</span>
            </span>
          </span>
          <span style="width: 100%; height: 6px; border-radius: 3px; background: #EBEBE5; overflow: hidden" aria-hidden="true"><span style="display: block; height: 6px; width: {{t.bar}}; border-radius: 3px; background: {{t.barColor}}"></span></span>
        </button>
      </sc-for>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 600">Type de batterie</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" onClick="{{pickLi}}" aria-pressed="{{liOn}}" style="display: flex; flex-direction: column; gap: 6px; padding: 14px; box-sizing: border-box; border-radius: 12px; border: {{liBorder}}; background: {{liBg}}; font: inherit; color: inherit; text-align: left; cursor: pointer">
          <span style="font-size: 16px; line-height: 22px; font-weight: 600">Lithium</span>
          <span style="font-size: 13px; line-height: 18px; color: #3D4149">Utilisable jusqu'à 80&#160;% de sa capacité.</span>
        </button>
        <button type="button" onClick="{{pickPb}}" aria-pressed="{{pbOn}}" style="display: flex; flex-direction: column; gap: 6px; padding: 14px; box-sizing: border-box; border-radius: 12px; border: {{pbBorder}}; background: {{pbBg}}; font: inherit; color: inherit; text-align: left; cursor: pointer">
          <span style="font-size: 16px; line-height: 22px; font-weight: 600">Plomb ou gel</span>
          <span style="font-size: 13px; line-height: 18px; color: #3D4149">Utilisable à 50&#160;%&#160;: il faut plus de capacité.</span>
        </button>
      </div>
    </section>
  </main>

  <div style="flex: none; padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #E2E2DC; box-shadow: 0 -6px 16px rgba(22, 24, 29, 0.06); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; line-height: 20px">
      <span style="color: #5E636B">{{selLabel}} · {{techLabel}}</span>
      <span style="font-weight: 600; font-variant-numeric: tabular-nums">≈&#160;{{selKwh}}&#160;kWh</span>
    </div>
    <a href="Resultat.dc.html" style="height: 52px; border-radius: 12px; background: #15803D; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
      Voir ma proposition
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { a: 1, tech: 'li' };
  }
  renderVals() {
    var E = 3277;
    var self = this;
    var dod = this.state.tech === 'li' ? 0.8 : 0.5;
    var T = [
      [0.5, 'Une nuit', '12 h sans soleil, jusqu’au matin'],
      [1, 'Une journée', '24 h sans soleil'],
      [1.5, 'Un jour et demi', '36 h sans soleil'],
      [2, 'Deux jours', '48 h sans soleil'],
      [3, 'Trois jours', '72 h sans soleil']
    ];
    var cap = function (a) { return E * a / (dod * 0.9) / 1000; };
    var max = cap(3);
    var f = function (v) { return v.toFixed(1).replace('.', ','); };
    var sel = T.find(function (t) { return t[0] === self.state.a; });
    var tiers = T.map(function (t) {
      var on = t[0] === self.state.a;
      return {
        label: t[1], sub: t[2], kwh: f(cap(t[0])), on: on,
        bar: Math.round(cap(t[0]) / max * 100) + '%',
        barColor: on ? '#16181D' : '#B9BBB3',
        border: on ? '1.5px solid #16181D' : '1px solid #E2E2DC',
        bg: on ? '#FFF5D6' : '#FFFFFF',
        ring: on ? '#16181D' : '#A7AAA2', dot: on ? '#16181D' : 'transparent',
        pick: function () { self.setState({ a: t[0] }); }
      };
    });
    var li = this.state.tech === 'li';
    return {
      tiers: tiers,
      selLabel: sel[1], selKwh: f(cap(sel[0])), techLabel: li ? 'lithium' : 'plomb ou gel',
      liOn: li, pbOn: !li,
      liBorder: li ? '1.5px solid #16181D' : '1px solid #E2E2DC', pbBorder: !li ? '1.5px solid #16181D' : '1px solid #E2E2DC',
      liBg: li ? '#FFF5D6' : '#FFFFFF', pbBg: !li ? '#FFF5D6' : '#FFFFFF',
      pickLi: function () { self.setState({ tech: 'li' }); },
      pickPb: function () { self.setState({ tech: 'pb' }); }
    };
  }
}
</script>
</body>
</html>
