name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
    services:
      # Base PostgreSQL des tests e2e de l'API.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simulateur
          POSTGRES_PASSWORD: simulateur
          POSTGRES_DB: simulateur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simulateur"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 10 (livré avec Node 22) ne relit pas correctement ce lockfile : npm 11 requis.
      - name: npm 11
        run: npm install -g npm@11.6.2

      - name: Installation
        run: npm ci

      - name: Format
        run: npx nx format:check --all

      - name: Lint
        run: npx nx run-many -t lint

      - name: Tests
        run: npx nx run-many -t test

      - name: Build
        run: npx nx run-many -t build

      - name: Tests e2e API (PostgreSQL)
        run: npx nx run api:e2e
        env:
          DATABASE_URL_TEST: postgresql://simulateur:simulateur@localhost:5432/simulateur_test

  e2e:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm 11
        run: npm install -g npm@11.6.2

      - name: Installation
        run: npm ci

      # Navigateur de la version épinglée de @playwright/test (en local, Chromium est préinstallé).
      - name: Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Build web
        run: npx nx build web

      - name: Tests e2e web (Playwright)
        run: npx nx e2e web-e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/apps/web-e2e/
          retention-days: 7
